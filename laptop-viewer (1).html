<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Laptop details</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e8ee;--tag:#4357f0;--tagink:#fff;--ok:#0e8a5f;--warn:#b45309;--bad:#c0392b;--inp:#f9fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.empty{text-align:center;color:var(--mut);padding:60px 16px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.cwrap{max-width:460px;margin:0 auto;padding:16px 14px 40px}
.vc{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 40px rgba(67,87,240,.12)}
.card .vc{box-shadow:none}
.vh{background:linear-gradient(150deg,#3346e0 0%,#5a6cf5 62%,#8493ff 100%);color:#fff;padding:22px 20px 24px}
.vh .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.vh .kind{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;opacity:.92}
.vh .pill{background:#fff;font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:99px}
.vh h2{margin:0;font-size:clamp(24px,6.5vw,31px);line-height:1.15;letter-spacing:-.02em;color:#fff;font-weight:700}
.vh .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.vh .chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500}
.vphoto{width:100%;height:170px;object-fit:cover;border-radius:14px;margin-bottom:16px;border:1px solid rgba(255,255,255,.4)}
.vb{padding:4px 20px 8px}
.blk{padding:18px 0;border-bottom:1px solid var(--line)}.blk:last-child{border-bottom:0}
.blk h3{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--mut)}
.war{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:none;position:relative}.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1.1;color:var(--ink)}
.ring small{font-size:11px;color:var(--mut);font-weight:500}
.wl{font-size:13px;color:var(--mut)}.wd{font-size:20px;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:#eceffe;color:var(--tag);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.who b{display:block;font-size:17px}.who span{color:var(--mut);font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px}
.kv div{min-width:0}.kv small{display:block;font-size:12.5px;color:var(--mut)}.kv b{font-weight:600;word-break:break-word}
.rw{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rw:last-child{border-bottom:0}.rw span{color:var(--mut)}.rw b{font-weight:600;text-align:right;word-break:break-word}
</style></head>
<body><div class="cwrap"><div id="out"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
/* warranty */
function warranty(d){
 if(!d.pd||!d.w)return null;var p=new Date(d.pd+"T00:00:00"),e=new Date(p);e.setMonth(e.getMonth()+Number(d.w));
 var now=new Date();now.setHours(0,0,0,0);var left=Math.round((e-now)/864e5),tot=Math.max(1,Math.round((e-p)/864e5));
 var st=left<0?["Expired","bad"]:left<=60?["Expiring soon","warn"]:["In warranty","ok"];
 return{exp:e,left:left,pct:Math.max(0,Math.min(100,Math.round(left/tot*100))),label:st[0],cls:st[1]}}
function fd(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}

/* detail view */
var BASE="https://claude.ai/artifact/9GEDF5C52NPAPrdVPU2hHG";
var ORDER=["b","m","sn","cpu","ram","st","os","pd","w","pp","ven","dep","eid","en","des","loc","cond","n"];
function enc(d){var s=ORDER.map(function(k){return d[k]||""}).join("\u001f").replace(/\u001f+$/,"");return btoa(unescape(encodeURIComponent(s))).replace(/=+$/,"").replace(/\+/g,"-p").replace(/\//g,"-s")}
function dec(h){if(!h||h.length<6||/[^A-Za-z0-9-]/.test(h))return null;try{var b=h.replace(/-p/g,"+").replace(/-s/g,"/");while(b.length%4)b+="=";var p=decodeURIComponent(escape(atob(b))).split("\u001f"),d={};ORDER.forEach(function(k,i){if(p[i])d[k]=p[i]});return d.m?d:null}catch(e){return null}}
var ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>';
function rw(k,v){return v?'<div class="rw"><span>'+k+'</span><b>'+esc(v)+'</b></div>':""}
function view(d,img){
 var w=warranty(d),h='<div class="vc"><div class="vh">';
 if(img)h+='<img class="vphoto" src="'+img+'" alt="Laptop photo">';
 h+='<div class="top"><span class="kind">'+ICON+'Company laptop</span>'+(w?'<span class="pill '+w.cls+'">'+w.label+'</span>':'')+'</div><h2>'+esc(d.m)+'</h2>';
 var ch=[d.cpu,d.ram,d.st,d.os].filter(Boolean);
 if(ch.length)h+='<div class="chips">'+ch.map(function(c){return'<span>'+esc(c)+'</span>'}).join('')+'</div>';
 h+='</div><div class="vb">';
 if(w){var n=w.left<0?"–":w.left;
  h+='<div class="blk"><h3>Warranty</h3><div class="war"><div class="ring '+w.cls+'"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="48" cy="48" r="40" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(w.pct*2.5133)+' 251.33"/></svg><b>'+n+'<small>'+(w.left<0?"expired":"days left")+'</small></b></div><div><div class="wl">Ends on</div><b class="wd">'+fd(w.exp)+'</b><div class="wl" style="margin-top:8px">Bought '+(d.pd?fd(new Date(d.pd+"T00:00:00")):"")+', covered for '+esc(d.w)+' months</div></div></div></div>'}
 var ini=(d.en||"?").split(/\s+/).slice(0,2).map(function(x){return x.charAt(0)}).join("").toUpperCase();
 h+='<div class="blk"><h3>Assigned to</h3><div class="who"><div class="av">'+esc(ini)+'</div><div><b>'+esc(d.en)+'</b><span>'+esc(d.des||d.dep)+'</span></div></div><div class="kv"><div><small>Department</small><b>'+esc(d.dep)+'</b></div><div><small>Employee ID</small><b>'+esc(d.eid)+'</b></div>'+(d.loc?'<div><small>Location</small><b>'+esc(d.loc)+'</b></div>':'')+'</div></div>';
 var rows=rw("Brand",d.b)+rw("Serial number",d.sn)+rw("Condition",d.cond)+rw("Price",d.pp?"BDT "+Number(d.pp).toLocaleString("en-US"):"")+rw("Vendor",d.ven)+(w?"":rw("Bought",d.pd?fd(new Date(d.pd+"T00:00:00")):""))+rw("Notes",d.n);
 if(rows)h+='<div class="blk"><h3>Device details</h3>'+rows+'</div>';
 return h+'</div></div>'}


function show(){var d=dec(location.hash.slice(1));
 if(!d){$("#out").innerHTML='<div class="empty"><b>No laptop found</b>Scan the QR label on a laptop to see its details.</div>';return}
 document.title=d.m+" – Laptop details";$("#out").innerHTML=view(d,null);window.scrollTo(0,0)}
window.addEventListener("hashchange",show);show();
})();
</script></body></html>
